# Security headers for the deployed app (nginx). Include inside the HTTPS
# server {} block. `always` adds them to error responses too.
#
# Why here and not in PHP: the page (index.html, app.js, styles.css) is served
# as static files, which never run PHP, so only the web server can add headers
# to them. The API also sets its own in PHP (src/security_headers.php), so it
# stays protected however it's served. HSTS lives here because only the HTTPS
# layer can set it. The page CSP below allows no inline scripts or styles.

add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header Content-Security-Policy "default-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

# Hide the server version (also set expose_php = Off in php.ini to drop X-Powered-By).
server_tokens off;

# The API sets its own stricter CSP (default-src 'none'); in nginx a location
# block's add_header replaces the server-level set, so repeat the others there:
# location /api/ {
#     add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
#     ... (the other headers above) ...
# }
